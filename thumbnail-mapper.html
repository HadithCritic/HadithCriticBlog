<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube thumbnail mapper</title>
<style>
:root{color-scheme:dark;--bg:#111110;--panel:#1c1b19;--line:#4c402a;--gold:#d8b166;--text:#f2ebdc;--muted:#b8ad99}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#111110f2;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font:600 20px Georgia,serif;margin:0;color:var(--gold)}header p{margin:2px 0 0;color:var(--muted);font-size:13px}.brand{margin-right:auto}button,input{font:inherit}button{border:1px solid var(--line);background:#28251f;color:var(--text);padding:9px 13px;border-radius:5px;cursor:pointer}button:hover{border-color:var(--gold)}button.primary{background:var(--gold);color:#181512;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(280px,34%) 1fr;min-height:calc(100vh - 80px)}aside{padding:18px;border-right:1px solid var(--line);position:sticky;top:83px;height:calc(100vh - 83px);overflow:auto}.videos{padding:18px;max-width:1200px;width:100%;margin:auto}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.section-head h2{font:600 16px Georgia,serif;margin:0}.section-head small{color:var(--muted)}input[type=search]{width:100%;background:#1a1917;border:1px solid var(--line);border-radius:5px;padding:10px;color:var(--text);margin:0 0 12px}.thumb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.thumb{border:1px solid #38332a;background:var(--panel);border-radius:5px;overflow:hidden;cursor:grab;position:relative}.thumb:active{cursor:grabbing}.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.thumb span{display:block;padding:6px 8px;font:12px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.thumb .used{position:absolute;top:5px;left:5px;background:var(--gold);color:#181512;border-radius:3px;padding:2px 5px;font-size:10px;font-weight:700}.video{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr);gap:15px;align-items:center;padding:12px;border:1px solid #39352e;border-radius:5px;background:var(--panel);margin:0 0 10px;min-height:136px}.video.dragover{outline:2px solid var(--gold);background:#2a261e}.slot{border:1px dashed #6b5b3c;border-radius:4px;min-height:108px;display:grid;place-items:center;color:var(--muted);text-align:center;overflow:hidden}.slot img{width:100%;height:100%;max-height:130px;object-fit:cover;display:block}.meta h3{font:600 16px/1.3 Georgia,serif;margin:0 0 7px}.meta code{color:var(--gold);font-size:12px}.drop-hint{font-size:12px;color:var(--muted);margin-top:8px}.assigned-name{font:12px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.empty{padding:16px;color:var(--muted);border:1px dashed var(--line)}.status{color:var(--gold);font-size:13px;min-width:90px}@media(max-width:760px){main{display:block}aside{position:static;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.thumb-grid{grid-template-columns:repeat(3,1fr)}.videos{padding:12px}.video{grid-template-columns:120px 1fr}.slot{min-height:72px}}@media(max-width:460px){.thumb-grid{grid-template-columns:1fr 1fr}.video{grid-template-columns:100px 1fr;gap:10px}.meta h3{font-size:14px}}
</style></head><body>
<header><div class="brand"><h1>Video thumbnail mapper</h1><p>Drag each WebP thumbnail onto its matching video. Your assignments save in this browser.</p></div><span class="status" id="status">No assignments</span><div class="toolbar"><button id="export" class="primary">Download mapping JSON</button><button id="import">Import mapping</button><input id="file" type="file" accept=".json,application/json" hidden><button id="clear">Clear all</button></div></header>
<main><aside><div class="section-head"><h2>WebP thumbnails</h2><small id="asset-count"></small></div><input id="thumb-search" type="search" placeholder="Filter thumbnails by filename"><div id="thumbs" class="thumb-grid"></div></aside><section class="videos"><div class="section-head"><h2>Videos</h2><small id="video-count"></small></div><input id="video-search" type="search" placeholder="Filter videos by title or ID"><div id="video-list"></div></section></main>
<script>
const videos=[{"id":"6bpJBji3E0M","title":"The Truth About 'The Crucifixion of Jesus'"},{"id":"HWHjCfaPn_0","title":"Hadith Can Never Reach Epistemological Certainty."},{"id":"xhDQSpYjqQ8","title":"Refuting OrthodoxMuslim & His Baghdad Failures"},{"id":"2sgC2CaJxqk","title":"The FAILED Baghdad Hadith Prophecy That Never Was"},{"id":"MLaRB6uGhAk","title":"How One Quranic Story Refutes All Sunni Jurisprudence"},{"id":"YTMWY2wsmNA","title":"Your Imam Can't Outrule God's Words (Refutation of Imām al-Shāfiʿī)"},{"id":"O79Y4X4tcyM","title":"The Anatomy of Hypocrisy"},{"id":"boG5JTD5yXU","title":"Your Sheikh Can't Save You from God"},{"id":"3B0rnPGWgKU","title":"The Scholars Contradict In Gradings of Hadith (Sahih/Da'if)"},{"id":"viBQWnMRLfU","title":"The Slave of Ibn ʿAbbās FOOLED Imām al-Bukhārī"},{"id":"CG5i14GAZTQ","title":"The Sciences of Hadīth are a Joke."},{"id":"vqaXqm_sRPE","title":"Bukhari Collected Hadith From Shia"},{"id":"5nJCg3j9SG4","title":"Imam Al Ghazali Annihilating Hadith Scholars For Over 8 Minutes Straight"},{"id":"w0RPjI0mr-E","title":"The Prophet Was NOT Bewitched"},{"id":"McqWF6Kzjpk","title":"The Prophesied Hasanid Mahdi"},{"id":"y-_RBOAF47c","title":"Contradicting Hadith & Nawawi's Authentic Cope."},{"id":"2LQS8gUXsO4","title":"Fabrication: If a Woman Rules, That Nation Will Not Prosper."},{"id":"dgm5LIxdLR4","title":"The Fabricated Prophecy: You Shall Conquer Constantinople"},{"id":"eNBjCFQ1IV0","title":"Fabrication: Angels Curse Women Who Don't Sleep With Their Husbands."},{"id":"EzyCSdCehXQ","title":"Did Muhammad Split the Moon?"},{"id":"T73hFVA9ND0","title":"The End Time Dajjal Narrations Are False."},{"id":"L5Rh1atEgBo","title":"Offensive Jihad? Abrogation in the Quran? - Debate"},{"id":"y9p3g0DM7tc","title":"Muhammad vs Cademon - The Story of The First Revelation"},{"id":"n1s7SGMrRhM","title":"Can Hadith Really Compete with Archaeology? A Sunni Faces the Harsh Truth - Debate"},{"id":"pFz9enPywrk","title":"Did Bukhari Authenticate Falsehood? - Testing the Sciences of Hadith"},{"id":"3vdO5CSCu88","title":"Hadith & Shahada - Debate"},{"id":"sIAJ_5rbCOU","title":"The Historical Argument Against 9:128 & 129 - An Analysis of the Hadith Corpus"},{"id":"1p2S5dm09eU","title":"The Satanic Verses - An Analysis of The Hadith Corpus"},{"id":"PCjq1nJCvRk","title":"Debate: The Testimony of God, His angels, and the Owners of Knowledge (3:18) pt.1"},{"id":"-wAazn82zTg","title":"Is The Prophet Muhammad An Idol? (Sunni-Traditionalist vs Submitters)"},{"id":"Lp-r5xcZEu4","title":"Apostasy - An Analysis of The Hadith Corpus"},{"id":"CACgVlRtEB0","title":"Are Hadith the Words of The Prophet? RefutingOrientalist Rage Quits."},{"id":"eaF0HN9gEJE","title":"The Zubayrid Mahdi - An Analysis of The Hadith Corpus"},{"id":"kqa4L76ykCY","title":"Dietary Prohibitions Debate (Submitters vs Hanafis)"},{"id":"8uuFjNrQZBo","title":"RefutingOrientalists Gets Refuted...By an Orientalist"},{"id":"j59Da8uGsck","title":"Jerusalem in The Islamic Tradition - An Analysis of The Hadith Corpus"},{"id":"6EWsciMiXg8","title":"The Second Coming of Jesus in Syria - An Analysis of the Hadith Corpus"},{"id":"lBK70hjlMg0","title":"Hadith Reliability and Salawat Upon the Prophet Muhammad (Navid, Dude, Jonathan)"}];
const assets=["thumbnail-03.webp","thumbnail-23.webp","yt-2LQS8gUXsO4.webp","yt-2sgC2CaJxqk.webp","yt-3B0rnPGWgKU.webp","yt-5nJCg3j9SG4.webp","yt-6bpJBji3E0M.webp","yt-CG5i14GAZTQ.webp","yt-EzyCSdCehXQ.webp","yt-HWHjCfaPn_0.webp","yt-MLaRB6uGhAk.webp","yt-McqWF6Kzjpk.webp","yt-O79Y4X4tcyM.webp","yt-T73hFVA9ND0.webp","yt-YTMWY2wsmNA.webp","yt-boG5JTD5yXU.webp","yt-dgm5LIxdLR4.webp","yt-eNBjCFQ1IV0.webp","yt-viBQWnMRLfU.webp","yt-vqaXqm_sRPE.webp","yt-w0RPjI0mr-E.webp","yt-xhDQSpYjqQ8.webp","yt-y-_RBOAF47c.webp"];
const STORAGE='hadithcritic-thumbnail-mapper-v1';
let mapping={};try{mapping=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{};for(const [id,name] of Object.entries(mapping))if(!assets.includes(name)||!videos.some(v=>v.id===id))delete mapping[id];
const enc=s=>encodeURIComponent(s);
const thumbEl=(file)=>{const el=document.createElement('img');el.src='./public/images/yt%20tn/'+enc(file);el.alt=file;return el};
function save(){localStorage.setItem(STORAGE,JSON.stringify(mapping));render();}
function render(){
 const q=document.querySelector('#thumb-search').value.toLowerCase();const tq=document.querySelector('#video-search').value.toLowerCase();
 const gallery=document.querySelector('#thumbs');gallery.replaceChildren();let shown=0;
 for(const file of assets){if(!file.toLowerCase().includes(q))continue;shown++;const card=document.createElement('div');card.className='thumb';card.draggable=true;card.dataset.file=file;card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',file);e.dataTransfer.effectAllowed='copy'});card.append(thumbEl(file));const label=document.createElement('span');label.textContent=file;card.append(label);const owners=Object.entries(mapping).filter(([,v])=>v===file).map(([id])=>id);if(owners.length){const badge=document.createElement('b');badge.className='used';badge.textContent='ASSIGNED';card.append(badge)}gallery.append(card)}
 if(!shown){const empty=document.createElement('div');empty.className='empty';empty.textContent='No matching thumbnails.';gallery.append(empty)}
 const list=document.querySelector('#video-list');list.replaceChildren();let count=0;
 for(const video of videos){if(!(video.title+' '+video.id).toLowerCase().includes(tq))continue;count++;const row=document.createElement('article');row.className='video';row.dataset.id=video.id;const slot=document.createElement('div');slot.className='slot';const file=mapping[video.id];if(file&&assets.includes(file)){slot.append(thumbEl(file))}else{slot.textContent='Drop the matching thumbnail here'}row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('dragover');e.dataTransfer.dropEffect='copy'});row.addEventListener('dragleave',()=>row.classList.remove('dragover'));row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('dragover');const picked=e.dataTransfer.getData('text/plain');if(assets.includes(picked)){mapping[video.id]=picked;save()}});const meta=document.createElement('div');meta.className='meta';const h=document.createElement('h3');h.textContent=video.title;const id=document.createElement('code');id.textContent=video.id;meta.append(h,id);if(file){const name=document.createElement('div');name.className='assigned-name';name.textContent=file;meta.append(name);const clear=document.createElement('button');clear.textContent='Remove';clear.style.marginTop='8px';clear.addEventListener('click',()=>{delete mapping[video.id];save()});meta.append(clear)}else{const hint=document.createElement('div');hint.className='drop-hint';hint.textContent='Drop a thumbnail on this video';meta.append(hint)}row.append(slot,meta);list.append(row)}
 document.querySelector('#asset-count').textContent=assets.length+' files';document.querySelector('#video-count').textContent=count+' shown / '+videos.length+' videos';const n=Object.keys(mapping).length;document.querySelector('#status').textContent=n+' assigned';
}
document.querySelector('#thumb-search').addEventListener('input',render);document.querySelector('#video-search').addEventListener('input',render);
document.querySelector('#export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({mapping,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='youtube-thumbnail-mapping.json';a.click();URL.revokeObjectURL(a.href)});
document.querySelector('#import').addEventListener('click',()=>document.querySelector('#file').click());document.querySelector('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());mapping=data.mapping||data;for(const [id,name] of Object.entries(mapping))if(!videos.some(v=>v.id===id)||!assets.includes(name))delete mapping[id];save()}catch{alert('That JSON file could not be read.')}e.target.value=''});
document.querySelector('#clear').addEventListener('click',()=>{if(confirm('Clear every saved assignment?')){mapping={};save()}});
render();
</script></body></html>
