name = "hadithcritic-studio"
main = "src/worker.mjs"
compatibility_date = "2026-10-12"
workers_dev = false
preview_urls = false

# A custom domain creates its own DNS record and certificate. Cloudflare Access
# (application "HadithCritic Studio") covers the whole hostname.
routes = [
  { pattern = "studio.hadithcriticblog.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
STUDIO_ALLOWED_HOST = "studio.hadithcriticblog.com"
STUDIO_REPO_OWNER = "HadithCritic"
STUDIO_REPO_NAME = "HadithCriticBlog"
STUDIO_SOURCE_REF = "drafts"
STUDIO_PUBLISH_BRANCH = "drafts"
STUDIO_PUBLISH_ENABLED = "true"
STUDIO_BRANCH_PROTECTION_VERIFIED = "true"
STUDIO_LIVE_BRANCH = "main"
# Analytics reads this zone with a read-only token held as a secret.
STUDIO_CF_ZONE_ID = "352efbdd0bf2d9bafd4dab74259583c5"

# Access team, audience, owner email and owner subject are Worker secrets,
# not vars, so they stay out of this public file.

# Private media. No custom domain or r2.dev URL may be attached to this bucket.
[[r2_buckets]]
binding = "STUDIO_MEDIA"
bucket_name = "hadithcritic-studio-media"

[[d1_databases]]
binding = "STUDIO_DB"
database_name = "hadithcritic-studio-private"
database_id = "7b982b99-e052-4370-a78c-a3361dc1b134"
migrations_dir = "migrations"
