<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 505" role="img" aria-label="Analytical figure" width="1130" height="505"><rect width="1130" height="505" fill="#0C0C0C"/><text x="47" y="60" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#D8AF69" text-anchor="start" >7 / SEVENTH-CENTURY HISTORY, LATER SURVIVING COPIES</text><text x="47" y="97" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#AAA49A" text-anchor="start" >Chronological context is separate from proving an ancestor by matching written variants.</text><path d="M 102 240 L 1050 240" fill="none" stroke="#D8AF69" stroke-width="3"/><path d="M 126 225 L 126 254" fill="none" stroke="#4B4135" stroke-width="3"/><text x="126" y="280" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#EFEADC" text-anchor="middle" >600</text><path d="M 343 225 L 343 254" fill="none" stroke="#4B4135" stroke-width="3"/><text x="343" y="280" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#EFEADC" text-anchor="middle" >632</text><path d="M 426 225 L 426 254" fill="none" stroke="#4B4135" stroke-width="3"/><text x="426" y="280" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#EFEADC" text-anchor="middle" >644</text><path d="M 510 225 L 510 254" fill="none" stroke="#4B4135" stroke-width="3"/><text x="510" y="280" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#EFEADC" text-anchor="middle" >656</text><path d="M 640 225 L 640 254" fill="none" stroke="#4B4135" stroke-width="3"/><text x="640" y="280" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#EFEADC" text-anchor="middle" >675</text><path d="M 808 225 L 808 254" fill="none" stroke="#4B4135" stroke-width="3"/><text x="808" y="280" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#EFEADC" text-anchor="middle" >700</text><path d="M 1020 225 L 1020 254" fill="none" stroke="#4B4135" stroke-width="3"/><text x="1020" y="280" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#EFEADC" text-anchor="middle" >750</text><rect x="410" y="146" width="100" height="53" rx="7" fill="#4E3B22" /><text x="460" y="177" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#D8AF69" text-anchor="middle" >ʿUthmān</text><text x="460" y="312" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#EFEADC" text-anchor="middle" >644–656 CE</text><rect x="525" y="330" width="340" height="77" rx="9" fill="#1C1B19" stroke="#4B4135" stroke-width="1"/><text x="695" y="362" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#EFEADC" text-anchor="middle" >CPP: third quarter of 7th c.</text><text x="695" y="390" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#AAA49A" text-anchor="middle" >estimated copying period</text><text x="47" y="470" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#AAA49A" text-anchor="start" >Parchment 14C dates the animal material, not the moment a scribe wrote on it.</text></svg>