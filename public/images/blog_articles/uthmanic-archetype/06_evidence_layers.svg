<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 671" role="img" aria-label="Analytical figure" width="1130" height="671"><rect width="1130" height="671" fill="#0C0C0C"/><text x="48" y="60" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#D8AF69" text-anchor="start" >6 / TWO DIFFERENT KINDS OF COMPARISON</text><text x="48" y="96" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#AAA49A" text-anchor="start" >Do not confuse published source data with a new independent photographic collation.</text><rect x="46" y="143" width="1027" height="129" rx="14" fill="#1C1B19" stroke="#4B4135" stroke-width="1"/><text x="75" y="175" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#D8AF69" text-anchor="start" >WRITTEN PATTERN</text><text x="75" y="221" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#EFEADC" text-anchor="start" >23 positions</text><text x="490" y="206" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#EFEADC" text-anchor="start" >14 manuscripts · Van Putten 2019</text><text x="490" y="239" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#AAA49A" text-anchor="start" >Published spellings; selected folios checked</text><rect x="46" y="293" width="1027" height="129" rx="14" fill="#1C1B19" stroke="#4B4135" stroke-width="1"/><text x="75" y="325" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#D8AF69" text-anchor="start" >REGIONAL COLLATION</text><text x="75" y="371" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#EFEADC" text-anchor="start" >63 variant positions</text><text x="490" y="356" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#EFEADC" text-anchor="start" >30 manuscript identifiers · Sidky 2020</text><text x="490" y="389" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#AAA49A" text-anchor="start" >Published and manuscript-based scholarship</text><rect x="46" y="443" width="1027" height="129" rx="14" fill="#1C1B19" stroke="#4B4135" stroke-width="1"/><text x="75" y="475" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#D8AF69" text-anchor="start" >OUR COMPUTATION</text><text x="75" y="521" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#EFEADC" text-anchor="start" >10,395 trees tested</text><text x="490" y="506" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#EFEADC" text-anchor="start" >eight selected profiles · Phase IV</text><text x="490" y="539" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#AAA49A" text-anchor="start" >One best tree under one model; branch limits</text><text x="47" y="639" font-family="Inter, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#AAA49A" text-anchor="start" >Statistical strength does not identify a commissioner or establish the exact direction of copying.</text></svg>