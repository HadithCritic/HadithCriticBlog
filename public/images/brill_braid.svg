<svg xmlns="http://www.w3.org/2000/svg" width="48" height="64" viewBox="0 0 48 64">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background transparent -->
  <!-- Layer 1: Charcoal band running top-left to bottom-right -->
  <polygon points="-8,8 32,48 42,38 2,-2" fill="#202325" stroke="#101213" stroke-width="1.2"/>
  <polygon points="-8,72 32,112 42,102 2,62" fill="#202325" stroke="#101213" stroke-width="1.2"/>
  
  <!-- Layer 2: Slate-grey band running top-right to bottom-left with shadow -->
  <polygon points="56,8 16,48 6,38 46,-2" fill="#9ba2a5" stroke="#52585a" stroke-width="1.2" filter="url(#shadow)"/>
  <polygon points="56,72 16,112 6,102 46,62" fill="#9ba2a5" stroke="#52585a" stroke-width="1.2" filter="url(#shadow)"/>
  
  <!-- Layer 3: Overlap piece where Charcoal crosses Over Grey -->
  <polygon points="17,23 31,37 23,45 9,31" fill="#202325" stroke="#101213" stroke-width="1.2"/>
  <polygon points="17,87 31,101 23,109 9,95" fill="#202325" stroke="#101213" stroke-width="1.2"/>
</svg>