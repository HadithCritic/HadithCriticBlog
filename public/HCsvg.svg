<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">HadithCritic three-ring geometric emblem</title>
  <desc id="desc">A monochrome vector mark made of three interlocking hexagonal rings.</desc>
  <style>
    .ring { transform-box: fill-box; transform-origin: center; fill: #D9B56D; }
    .ring-top { animation: ringTopLock 900ms cubic-bezier(.22,1,.36,1) both, logoGlow 4s ease-in-out 1.2s infinite; }
    .ring-middle { animation: ringMiddleLock 950ms cubic-bezier(.22,1,.36,1) both, logoGlow 4s ease-in-out 1.2s infinite; }
    .ring-bottom { animation: ringBottomLock 1000ms cubic-bezier(.22,1,.36,1) both, logoGlow 4s ease-in-out 1.2s infinite; }
    svg:hover .ring-top { transform: translateY(-4px) rotate(-2deg); transition: transform 280ms ease; }
    svg:hover .ring-middle { transform: translateX(4px); transition: transform 280ms ease; }
    svg:hover .ring-bottom { transform: translateY(4px) rotate(2deg); transition: transform 280ms ease; }
    @keyframes ringTopLock { 0% { opacity: 0; transform: translateY(-40px) rotate(-6deg) scale(.96); } 60% { opacity: 1; transform: translateY(6px) rotate(1deg) scale(1.02); } 100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); } }
    @keyframes ringMiddleLock { 0% { opacity: 0; transform: scale(.92); } 55% { opacity: 1; transform: scale(1.03); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes ringBottomLock { 0% { opacity: 0; transform: translateY(40px) rotate(6deg) scale(.96); } 60% { opacity: 1; transform: translateY(-6px) rotate(-1deg) scale(1.02); } 100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); } }
    @keyframes logoGlow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.08); } }
  </style>
  <g transform="translate(340.218 78.000) scale(0.908901)">
