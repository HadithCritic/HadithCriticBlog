name: CI

on:
  push:
    branches: [main, drafts]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint:footnotes

      - run: npm run test:notifications

      - run: npm run check

      - run: npm run test:design

      - run: npm run build

      # tests/ holds the checks that cover what PRODUCT.md actually promises:
      # one main landmark per page, no horizontal overflow at 390px, focus
      # returned after the mobile menu closes, reduced motion leaving content
      # visible, and Pagefind returning a real article. They need the built
      # dist/, so they run last.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
