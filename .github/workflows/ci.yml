name: CI

on:
  push:
    branches: [main, drafts]
  pull_request:
    branches: [main, drafts]

permissions:
  contents: read

jobs:
  test:
    # Keep the image fixed while ubuntu-latest rolls to Ubuntu 26.04 in
    # October 2026, so this project's toolchain does not change under CI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the floor in package.json. The tests strip types from an
          # imported .ts, which needs 24.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run lint:footnotes

      - run: npm run test:subscribe

      # Arabic normalisation and the display formatter.
      - run: npm run test:normalize

      # Source graph projections and edge-to-source invariants.
      - run: npm run test:research

      - run: npm run check

      - run: npm run test:design

      # Builds the site with draft articles included for the reader tests.
      - run: npm run build:e2e

      - run: npx playwright install --with-deps chromium

      # tests/ holds the checks that cover what PRODUCT.md actually promises:
      # one main landmark per page, no horizontal overflow at 390px, focus
      # returned after the mobile menu closes, reduced motion leaving content
      # visible, and Pagefind returning a real article. They need the built
      # dist/, so they run last.
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
