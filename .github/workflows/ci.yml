name: CI

on:
  push:
    branches: [main, drafts]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint:footnotes

      - run: npm run test:notifications

      - run: npm run check

      - run: npm run test:design

      - run: npm run build
